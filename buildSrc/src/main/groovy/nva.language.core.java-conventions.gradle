plugins {
    id 'nva.java-conventions'
    id 'maven-publish'
}

group = 'com.github.bibsysdev'
version = '1.2.2'

nva {
    errorprone {
        allErrorsAsWarnings = false
    }
    java {
        languageVersion = 21
    }
    pmd {
        rulesetFile = rootProject.file('config/pmd/ruleset.xml')
    }
    spotless {
        enabled = true
    }
}
